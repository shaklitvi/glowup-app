<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowUp - רשת חברתית AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff00ff;
            --secondary: #9d4edd;
            --accent: #00d4ff;
            --bg: #0a0015;
            --card-bg: #1a0033;
            --text: #ffffff;
            --text-dim: #b0b0b0;
            --border: rgba(255, 0, 255, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        .screen {
            display: none;
            min-height: 100vh;
            overflow-y: auto;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
        }

        /* Auth Screens */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-box {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
        }

        .auth-box h1 {
            font-size: 32px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .auth-box p {
            color: var(--text-dim);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 0, 255, 0.1);
            border: 2px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            margin-top: 20px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 0, 255, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: var(--accent);
            border: 2px solid var(--accent);
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: rgba(0, 212, 255, 0.1);
        }

        /* Main App */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            padding: 15px;
            background: rgba(10, 0, 21, 0.95);
            border-bottom: 1px solid var(--border);
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .post {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .post-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .post-user-info {
            flex: 1;
        }

        .post-username {
            font-weight: 700;
            font-size: 14px;
        }

        .post-time {
            font-size: 12px;
            color: var(--text-dim);
        }

        .post-image {
            width: 100%;
            border-radius: 12px;
            margin: 15px 0;
            max-height: 400px;
            object-fit: cover;
        }

        .post-caption {
            margin-bottom: 15px;
            font-size: 14px;
        }

        .post-transform {
            padding: 10px;
            background: rgba(255, 0, 255, 0.1);
            border-left: 3px solid var(--primary);
            border-radius: 5px;
            font-size: 12px;
            color: var(--accent);
            margin-bottom: 15px;
        }

        .post-actions {
            display: flex;
            gap: 20px;
            justify-content: space-around;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }

        .action-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 14px;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .action-btn:hover {
            background: rgba(255, 0, 255, 0.1);
            color: var(--primary);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
        }

        .tab-btn {
            padding: 8px 16px;
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-weight: 600;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .transformation-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .transform-btn {
            padding: 12px;
            background: var(--card-bg);
            border: 2px solid var(--border);
            color: var(--text);
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .transform-btn:hover {
            border-color: var(--primary);
        }

        .transform-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: var(--primary);
        }

        .nav {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            border-top: 1px solid var(--border);
            background: rgba(10, 0, 21, 0.95);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            padding: 8px;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .nav-item:hover {
            background: rgba(255, 0, 255, 0.1);
            color: var(--primary);
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-icon {
            font-size: 24px;
        }

        .nav-label {
            font-size: 12px;
            font-weight: 600;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 15px;
        }

        .profile-name {
            font-size: 20px;
            font-weight: 700;
        }

        .profile-username {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 15px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 5px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        .error {
            background: rgba(255, 100, 100, 0.1);
            border: 2px solid #ff6464;
            color: #ff6464;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .success {
            background: rgba(0, 212, 255, 0.1);
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="screen active">
        <div class="auth-container">
            <div class="auth-box">
                <h1>🚀 GlowUp</h1>
                <p>רשת חברתית עם AI</p>

                <div class="form-group">
                    <label>📧 דוא"ל</label>
                    <input type="email" id="login-email" placeholder="your@email.com">
                </div>

                <div class="form-group">
                    <label>🔐 סיסמה</label>
                    <input type="password" id="login-password" placeholder="סיסמה">
                </div>

                <button class="btn btn-primary" onclick="login()">כניסה</button>
                <button class="btn btn-secondary" onclick="switchToRegister()">הרשמה חדשה</button>
            </div>
        </div>
    </div>

    <!-- Register Screen -->
    <div id="register-screen" class="screen">
        <div class="auth-container">
            <div class="auth-box">
                <h1>🎉 הרשמה</h1>
                <p>הצטרף ל-GlowUp</p>

                <div class="form-group">
                    <label>👤 שם משתמש</label>
                    <input type="text" id="register-username" placeholder="username">
                </div>

                <div class="form-group">
                    <label>📧 דוא"ל</label>
                    <input type="email" id="register-email" placeholder="your@email.com">
                </div>

                <div class="form-group">
                    <label>🔐 סיסמה</label>
                    <input type="password" id="register-password" placeholder="סיסמה">
                </div>

                <button class="btn btn-primary" onclick="register()">הרשמה</button>
                <button class="btn btn-secondary" onclick="switchToLogin()">חזור לכניסה</button>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app-screen" class="screen">
        <div class="app-container">
            <div class="header">
                <h1>🚀 GlowUp</h1>
            </div>

            <div class="content">
                <!-- Feed Tab -->
                <div id="feed-tab" class="active">
                    <div class="tabs">
                        <button class="tab-btn active" onclick="switchTab('feed')">🏠 פיד</button>
                        <button class="tab-btn" onclick="switchTab('create')">✨ יצור</button>
                        <button class="tab-btn" onclick="switchTab('profile')">👤 פרופיל</button>
                    </div>

                    <div id="posts-container"></div>
                </div>

                <!-- Create Tab -->
                <div id="create-tab" style="display:none;">
                    <div class="tabs">
                        <button class="tab-btn" onclick="switchTab('feed')">🏠 פיד</button>
                        <button class="tab-btn active" onclick="switchTab('create')">✨ יצור</button>
                        <button class="tab-btn" onclick="switchTab('profile')">👤 פרופיל</button>
                    </div>

                    <div class="post">
                        <h2>✨ יצור פוסט חדש</h2>

                        <div class="form-group" style="margin-top: 20px;">
                            <label>📸 תמונה</label>
                            <input type="file" id="create-image" accept="image/*" onchange="previewImage(this)">
                            <img id="image-preview" style="max-width: 100%; border-radius: 10px; margin-top: 10px; display:none;">
                        </div>

                        <div class="form-group">
                            <label>💬 כיתוב</label>
                            <input type="text" id="create-caption" placeholder="כתוב משהו...">
                        </div>

                        <div class="form-group">
                            <label>🤖 בחר טרנספורמציה</label>
                            <div class="transformation-grid">
                                <button class="transform-btn" onclick="selectTransform('רובוט עם עיניים זוהרות', this)">🤖 רובוט</button>
                                <button class="transform-btn" onclick="selectTransform('בחלל עם כוכבים', this)">🚀 חלל</button>
                                <button class="transform-btn" onclick="selectTransform('בחוף בריו דה ז׳נרו', this)">🏖️ ריו</button>
                                <button class="transform-btn" onclick="selectTransform('סופרמן עם כוחות', this)">🦸 סופרמן</button>
                                <button class="transform-btn" onclick="selectTransform('ספיידרמן בעיר', this)">🕷️ ספיידר</button>
                                <button class="transform-btn" onclick="selectTransform('דמות אנימה', this)">✨ אנימה</button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>🔑 Hugging Face API Key</label>
                            <input type="password" id="create-api-key" placeholder="הדבק את ה-API key">
                        </div>

                        <button class="btn btn-primary" onclick="createPost()">📤 פרסם פוסט</button>
                    </div>
                </div>

                <!-- Profile Tab -->
                <div id="profile-tab" style="display:none;">
                    <div class="tabs">
                        <button class="tab-btn" onclick="switchTab('feed')">🏠 פיד</button>
                        <button class="tab-btn" onclick="switchTab('create')">✨ יצור</button>
                        <button class="tab-btn active" onclick="switchTab('profile')">👤 פרופיל</button>
                    </div>

                    <div class="profile-header">
                        <div class="profile-avatar" id="profile-avatar">👤</div>
                        <div class="profile-name" id="profile-name">שם משתמש</div>
                        <div class="profile-username" id="profile-email">email@example.com</div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="stat-value" id="profile-posts">0</div>
                            <div class="stat-label">פוסטים</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value" id="profile-followers">0</div>
                            <div class="stat-label">עוקבים</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value" id="profile-glowscore">0</div>
                            <div class="stat-label">GlowScore</div>
                        </div>
                    </div>

                    <button class="btn btn-secondary" onclick="logout()" style="width: 100%;">🚪 התנתק</button>
                </div>
            </div>

            <div class="nav">
                <div class="nav-item active" onclick="switchTab('feed')">
                    <div class="nav-icon">🏠</div>
                    <div class="nav-label">פיד</div>
                </div>
                <div class="nav-item" onclick="switchTab('create')">
                    <div class="nav-icon">✨</div>
                    <div class="nav-label">יצור</div>
                </div>
                <div class="nav-item" onclick="switchTab('profile')">
                    <div class="nav-icon">👤</div>
                    <div class="nav-label">פרופיל</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let currentToken = null;
        let selectedImage = null;
        let selectedTransform = '';

        // Dynamic API_BASE - use current domain if available, fallback to Vercel
        const API_BASE = window.location.hostname.includes('github.io')
          ? window.location.origin  // For GitHub Pages
          : (window.location.hostname.includes('vercel')
            ? window.location.origin  // For Vercel deployment
            : 'http://localhost:3000');  // For local dev

        // בדיקה אם יש משתמש מחובר
        window.addEventListener('load', () => {
            const token = localStorage.getItem('glowup-token');
            if (token) {
                currentToken = token;
                try {
                    const decoded = JSON.parse(atob(token.split('.')[1]));
                    currentUser = decoded.email;
                    switchScreen('app-screen');
                    loadPosts();
                    loadProfile();
                } catch (e) {
                    localStorage.removeItem('glowup-token');
                }
            }
        });

        // עדכון הודעות
        function showMessage(message, type = 'success') {
            const messageDiv = document.createElement('div');
            messageDiv.className = type === 'error' ? 'error' : 'success';
            messageDiv.textContent = message;
            document.querySelector('.content').prepend(messageDiv);
            setTimeout(() => messageDiv.remove(), 3000);
        }

        // הרשמה
        async function register() {
            const username = document.getElementById('register-username').value.trim();
            const email = document.getElementById('register-email').value.trim();
            const password = document.getElementById('register-password').value.trim();

            if (!username || !email || !password) {
                showMessage('אנא מלא את כל השדות', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/auth`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'register', email, password, username })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('glowup-token', data.token);
                    currentUser = email;
                    currentToken = data.token;
                    switchScreen('app-screen');
                    loadProfile();
                    showMessage('✅ הרשמה בהצלחה!');
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                showMessage('❌ שגיאה בהרשמה', 'error');
            }
        }

        // כניסה
        async function login() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();

            if (!email || !password) {
                showMessage('אנא מלא את כל השדות', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/auth`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'login', email, password })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('glowup-token', data.token);
                    currentUser = email;
                    currentToken = data.token;
                    switchScreen('app-screen');
                    loadPosts();
                    loadProfile();
                    showMessage('✅ כניסה בהצלחה!');
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                showMessage('❌ שגיאה בכניסה', 'error');
            }
        }

        // התנתקות
        function logout() {
            localStorage.removeItem('glowup-token');
            currentUser = null;
            currentToken = null;
            switchScreen('login-screen');
            showMessage('✅ התנתקת בהצלחה');
        }

        // מעבר בין מסכים
        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // מעבר בין טאבים
        function switchTab(tab) {
            document.querySelectorAll('[id$="-tab"]').forEach(t => t.style.display = 'none');
            document.getElementById(tab + '-tab').style.display = 'block';

            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            event.target.closest('.nav-item')?.classList.add('active');
        }

        // עדכון כניסה/הרשמה
        function switchToRegister() {
            switchScreen('register-screen');
        }

        function switchToLogin() {
            switchScreen('login-screen');
        }

        // בחירת טרנספורמציה
        function selectTransform(text, btn) {
            document.querySelectorAll('.transform-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedTransform = text;
        }

        // תצוגה מקדימה של תמונה
        function previewImage(input) {
            const reader = new FileReader();
            reader.onload = (e) => {
                selectedImage = e.target.result;
                const preview = document.getElementById('image-preview');
                preview.src = selectedImage;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(input.files[0]);
        }

        // טעינת פוסטים
        async function loadPosts() {
            try {
                const response = await fetch(`${API_BASE}/api/posts`);
                const data = await response.json();
                const container = document.getElementById('posts-container');

                if (data.posts.length === 0) {
                    container.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-dim);">אין פוסטים עדיין 📝</div>';
                    return;
                }

                container.innerHTML = data.posts.map(post => `
                    <div class="post">
                        <div class="post-header">
                            <div class="post-avatar">${post.author.substring(0, 1).toUpperCase()}</div>
                            <div class="post-user-info">
                                <div class="post-username">${post.author}</div>
                                <div class="post-time">לפני זמן מה</div>
                            </div>
                        </div>
                        <img src="${post.image}" class="post-image">
                        ${post.caption ? `<div class="post-caption">${post.caption}</div>` : ''}
                        ${post.transformation ? `<div class="post-transform">🤖 ${post.transformation}</div>` : ''}
                        <div class="post-actions">
                            <button class="action-btn" onclick="likePost('${post.id}')">❤️ ${post.likes}</button>
                            <button class="action-btn">💬 0</button>
                            <button class="action-btn">📤</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('שגיאה בטעינת פוסטים:', error);
            }
        }

        // יצירת פוסט
        async function createPost() {
            if (!selectedImage) {
                showMessage('בחר תמונה קודם', 'error');
                return;
            }

            if (!selectedTransform) {
                showMessage('בחר טרנספורמציה', 'error');
                return;
            }

            const caption = document.getElementById('create-caption').value;
            const apiKey = document.getElementById('create-api-key').value;

            if (!apiKey) {
                showMessage('הדבק את ה-API key שלך', 'error');
                return;
            }

            // תחילה, הפעל את AI transformation
            try {
                const transformResponse = await fetch(`${API_BASE}/api/edit-image`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        image: selectedImage,
                        prompt: selectedTransform,
                        apiKey: apiKey
                    })
                });

                const transformData = await transformResponse.json();

                if (!transformData.success) {
                    showMessage(transformData.error, 'error');
                    return;
                }

                // אחרי הצלחה בטרנספורמציה, צור פוסט
                const response = await fetch(`${API_BASE}/api/posts`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${currentToken}`
                    },
                    body: JSON.stringify({
                        image: transformData.image,
                        caption: caption,
                        transformation: selectedTransform
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('✅ פוסט יצור בהצלחה!');
                    document.getElementById('create-image').value = '';
                    document.getElementById('create-caption').value = '';
                    document.getElementById('image-preview').style.display = 'none';
                    selectedImage = null;
                    selectedTransform = '';
                    loadPosts();
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                showMessage('❌ שגיאה בהעלאת הפוסט', 'error');
            }
        }

        // טעינת פרופיל
        function loadProfile() {
            if (currentUser) {
                document.getElementById('profile-name').textContent = currentUser.split('@')[0];
                document.getElementById('profile-email').textContent = currentUser;
                document.getElementById('profile-avatar').textContent = currentUser[0].toUpperCase();
            }
        }

        // like post
        function likePost(postId) {
            showMessage('❤️ הנוק!');
        }
    </script>
</body>
