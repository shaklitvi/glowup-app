<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>GlowUp ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Noto+Sans+Hebrew:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080810; --bg2: #12121f; --pink: #ff2d78; --cyan: #00d4ff;
            --grad: linear-gradient(135deg, #ff2d78, #a855f7, #00d4ff);
            --text: #f0f0ff; --border: rgba(255,255,255,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: var(--bg); color: var(--text); font-family: 'Noto Sans Hebrew', sans-serif; 
            overflow: hidden; height: 100vh; overscroll-behavior: none;
        }
        
        #app { display: flex; flex-direction: column; height: 100vh; max-width: 500px; margin: 0 auto; position: relative; }
        
        /* Header */
        header { padding: 50px 20px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: rgba(8,8,16,0.8); backdrop-filter: blur(10px); z-index: 10; }
        .logo { font-family: 'Syne', sans-serif; font-size: 22px; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        .stats { display: flex; gap: 8px; }
        .stat-chip { background: var(--bg2); padding: 5px 12px; border-radius: 20px; font-size: 12px; border: 1px solid var(--border); font-weight: bold; }

        /* Content Areas */
        .content { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 100px; }
        .pane { display: none; animation: fadeIn 0.3s ease; }
        .pane.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Feed */
        .card { background: var(--bg2); border-radius: 24px; margin-bottom: 20px; overflow: hidden; border: 1px solid var(--border); }
        .card-img-container { width: 100%; aspect-ratio: 1/1; background: #000; position: relative; }
        .card-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { padding: 15px; }

        /* Create Tab */
        .upload-zone { border: 2px dashed var(--pink); border-radius: 24px; height: 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(255,45,120,0.03); margin-bottom: 20px; cursor: pointer; position: relative; overflow: hidden; }
        #preview-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        .filter-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 10px 0; margin-bottom: 20px; scrollbar-width: none; }
        .filter-item { min-width: 65px; text-align: center; font-size: 11px; opacity: 0.5; transition: 0.3s; }
        .filter-item.active { opacity: 1; color: var(--pink); font-weight: bold; }
        .f-circle { width: 50px; height: 50px; background: #222; border-radius: 14px; margin: 0 auto 6px; border: 2px solid transparent; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .filter-item.active .f-circle { border-color: var(--pink); transform: scale(1.1); }

        /* Buttons */
        .btn { width: 100%; padding: 18px; border-radius: 18px; border: none; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.2s; background: var(--grad); color: white; font-family: 'Syne', sans-serif; }
        .btn:disabled { opacity: 0.4; filter: grayscale(1); }

        /* Navigation */
        nav { position: fixed; bottom: 0; left: 0; right: 0; height: 85px; background: rgba(10,10,20,0.95); display: flex; border-top: 1px solid var(--border); backdrop-filter: blur(20px); padding-bottom: 20px; }
        .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: #555; cursor: pointer; transition: 0.3s; }
        .nav-btn.active { color: var(--pink); }
        .nav-btn span { font-size: 22px; margin-bottom: 4px; }

        /* AI Result Box */
        #ai-result { margin-top: 20px; display: none; animation: slideUp 0.4s ease; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .spin { width: 18px; height: 18px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: rot 0.8s linear infinite; display: inline-block; margin-left: 10px; }
        @keyframes rot { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="app">
    <header>
        <div class="logo">GLOWUP ✨</div>
        <div class="stats">
            <div class="stat-chip">🪙 <span id="coin-count">100</span></div>
            <div class="stat-chip" style="color: var(--cyan);">⚡ <span id="xp-count">0</span></div>
        </div>
    </header>

    <div class="content">
        <div id="pane-feed" class="pane active">
            <div id="feed-list"></div>
        </div>

        <div id="pane-create" class="pane">
            <div class="upload-zone" onclick="document.getElementById('img-input').click()">
                <div id="upload-msg">
                    <div style="font-size: 50px; margin-bottom: 10px;">📸</div>
                    <p style="font-weight: bold; color: #888;">לחץ להעלאת תמונה</p>
                </div>
                <img id="preview-img">
            </div>
            <input type="file" id="img-input" hidden accept="image/*" onchange="handleFile(event)">

            <div class="filter-scroll">
                <div class="filter-item active" onclick="applyF('none', this)"><div class="f-circle">🖼️</div>רגיל</div>
                <div class="filter-item" onclick="applyF('brightness(1.2) saturate(1.4)', this)"><div class="f-circle" style="filter: brightness(1.2) saturate(1.4)">✨</div>Glow</div>
                <div class="filter-item" onclick="applyF('hue-rotate(280deg)', this)"><div class="f-circle" style="filter: hue-rotate(280deg)">🌌</div>Cyber</div>
                <div class="filter-item" onclick="applyF('sepia(0.4) contrast(1.1)', this)"><div class="f-circle" style="filter: sepia(0.4) contrast(1.1)">🎞️</div>Retro</div>
            </div>

            <button id="ai-btn" class="btn" onclick="startAI()" disabled>🔍 נתח עם AI</button>

            <div id="ai-result"></div>
        </div>

        <div id="pane-profile" class="pane">
            <div style="text-align: center; padding: 30px 0;">
                <div style="width: 90px; height: 90px; background: var(--grad); border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 45px; box-shadow: 0 10px 20px rgba(255,45,120,0.3);">😎</div>
                <h2 id="user-name">Glow Master</h2>
                <p style="color: #666; font-size: 14px; margin-top: 5px;">Level <span id="level-display">1</span></p>
            </div>
            <div style="background: var(--bg2); padding: 20px; border-radius: 20px; border: 1px solid var(--border);">
                <p style="font-size: 12px; color: #888; margin-bottom: 10px;">הגדרות API (אופציונלי)</p>
                <input type="password" id="api-field" placeholder="הדבק מפתח OpenAI כאן..." style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #333; background: #000; color: #fff; margin-bottom: 10px;">
                <button class="btn" style="background: #222; font-size: 14px; padding: 12px;" onclick="saveApiKey()">שמור מפתח</button>
            </div>
        </div>
    </div>

    <nav>
        <div class="nav-btn active" onclick="switchTab('feed', this)"><span>🏠</span>פיד</div>
        <div class="nav-btn" onclick="switchTab('create', this)"><span>➕</span>צור</div>
        <div class="nav-btn" onclick="switchTab('profile', this)"><span>👤</span>פרופיל</div>
    </nav>
</div>

<script>
    // State
    let appState = JSON.parse(localStorage.getItem('gu_data')) || { xp: 0, coins: 100, posts: [] };
    let curImgData = null;
    let curFilter = 'none';

    // Tabs
    function switchTab(target, el) {
        document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('pane-' + target).classList.add('active');
        el.classList.add('active');
    }

    // Image Upload
    function handleFile(e) {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            curImgData = ev.target.result;
            const img = document.getElementById('preview-img');
            img.src = curImgData;
            img.style.display = 'block';
            document.getElementById('upload-msg').style.display = 'none';
            document.getElementById('ai-btn').disabled = false;
            document.getElementById('ai-result').style.display = 'none';
        };
        reader.readAsDataURL(file);
    }

    // Filters
    function applyF(f, el) {
        curFilter = f;
        document.getElementById('preview-img').style.filter = f;
        document.querySelectorAll('.filter-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
    }

    // AI Logic
    async function startAI() {
        const btn = document.getElementById('ai-btn');
        const resBox = document.getElementById('ai-result');
        const key = localStorage.getItem('gu_key');

        btn.disabled = true;
        btn.innerHTML = '<span class="spin"></span> מנתח את הסטייל...';

        // סימולציה מהירה של AI (או חיבור אמיתי אם יש מפתח)
        setTimeout(() => {
            const score = Math.floor(Math.random() * 25) + 70;
            resBox.innerHTML = `
                <div style="background: var(--bg2); padding: 25px; border-radius: 24px; border: 1px solid var(--pink); text-align: center;">
                    <div style="font-size: 48px; font-weight: 800; color: var(--pink); margin-bottom: 5px;">${score}%</div>
                    <p style="text-transform: uppercase; letter-spacing: 2px; font-size: 12px; margin-bottom: 20px;">Glow Score</p>
                    <p style="margin-bottom: 20px; font-size: 15px; line-height: 1.5;"><b>Vibe:</b> Urban Cyberpunk 🔥<br>התאורה מושלמת והקומפוזיציה חזקה מאוד.</p>
                    <button class="btn" onclick="finalizePost(${score})">📲 פרסם בפיד</button>
                </div>
            `;
            resBox.style.display = 'block';
            btn.innerHTML = '🔍 נתח שוב';
            btn.disabled = false;
        }, 1800);
    }

    // Posting
    function finalizePost(score) {
        const post = {
            id: Date.now(),
            img: curImgData,
            filter: curFilter,
            score: score,
            date: new Date().toLocaleDateString('he-IL')
        };
        appState.posts.unshift(post);
        appState.xp += 50;
        appState.coins += 25;
        save();
        renderFeed();
        
        // Reset UI
        document.getElementById('preview-img').style.display = 'none';
        document.getElementById('upload-msg').style.display = 'block';
        document.getElementById('ai-result').style.display = 'none';
        document.getElementById('ai-btn').disabled = true;
        
        switchTab('feed', document.querySelectorAll('.nav-btn')[0]);
    }

    function renderFeed() {
        const list = document.getElementById('feed-list');
        document.getElementById('coin-count').innerText = appState.coins;
        document.getElementById('xp-count').innerText = appState.xp;
        document.getElementById('level-display').innerText = Math.floor(appState.xp / 500) + 1;

        if(appState.posts.length === 0) {
            list.innerHTML = '<div style="text-align:center; padding:80px 20px; color:#555;"><h3>הפיד ריק... 🌌</h3><p>תעלה תמונה כדי להתחיל!</p></div>';
            return;
        }

        list.innerHTML = appState.posts.map(p => `
            <div class="card">
                <div style="padding:15px; display:flex; justify-content:space-between; align-items:center;">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <div style="width:30px; height:30px; background:var(--grad); border-radius:50%;"></div>
                        <span style="font-weight:bold; font-size:14px;">You</span>
                    </div>
                    <span style="color:var(--pink); font-weight:800;">⭐ ${p.score}</span>
                </div>
                <div class="card-img-container">
                    <img src="${p.img}" style="filter: ${p.filter}">
                </div>
                <div class="card-info">
                    <p style="font-size:14px;">איזה סטייל מטורף! ה-GlowUp שלי להיום ✨</p>
                    <p style="font-size:10px; color:#555; margin-top:10px;">פורסם ב-${p.date}</p>
                </div>
            </div>
        `).join('');
    }

    function save() { localStorage.setItem('gu_data', JSON.stringify(appState)); }
    
    function saveApiKey() {
        const val = document.getElementById('api-field').value;
        if(val) {
            localStorage.setItem('gu_key', val);
            alert('המפתח נשמר בהצלחה!');
        }
    }

    // Init
    renderFeed();
</script>
</body>
</html>
