<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GlowUp App</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #07070F;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #FF2D78, #FFAC2D);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.1rem;
            opacity: 0.8;
            margin-bottom: 30px;
        }
        .btn {
            background: linear-gradient(45deg, #FF2D78, #FFAC2D);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 45, 120, 0.3);
            text-decoration: none;
            display: inline-block;
        }
        .preview-box {
            width: 250px;
            height: 250px;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="preview-box">✨</div>
        <h1>GlowUp</h1>
        <p>הפוך כל תמונה ליצירת אמנות בתוך שניות</p>
        
        <input type="file" id="upload" hidden accept="image/*">
        <button class="btn" onclick="document.getElementById('upload').click()">העלה תמונה</button>
    </div>

    <script>
        // כאן יבוא בהמשך הקוד של ה-AI והפילטרים
        document.getElementById('upload').onchange = function() {
            alert('התמונה הועלתה! בשלב הבא נוסיף את פילטרי ה-AI');
        };
    </script>
</body>
</html>
