<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#080810">
    <title>GlowUp ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Noto+Sans+Hebrew:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- CSS VARIABLES & BASE --- */
        :root {
            --bg: #080810; --bg2: #12121f; --pink: #ff2d78; --cyan: #00d4ff; --purple: #a855f7;
            --yellow: #ffd60a; --text: #f0f0ff; --border: rgba(255,255,255,0.1);
            --grad: linear-gradient(135deg, #ff2d78, #a855f7, #00d4ff);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: var(--bg); color: var(--text); font-family: 'Noto Sans Hebrew', sans-serif; 
            overflow: hidden; height: 100vh; overscroll-behavior: none;
        }

        /* --- APP STRUCTURE --- */
        #app { display: flex; flex-direction: column; height: 100vh; max-width: 500px; margin: 0 auto; }
        #header { padding: 50px 20px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: rgba(8,8,16,0.8); backdrop-filter: blur(10px); }
        .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        #content { flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .pane { display: none; padding: 15px; animation: fadeIn 0.3s ease; }
        .pane.on { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- UI COMPONENTS --- */
        .chip { background: var(--border); padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-left: 5px; border: 1px solid rgba(255,255,255,0.05); }
        .card { background: var(--bg2); border-radius: 24px; margin-bottom: 20px; overflow: hidden; border: 1px solid var(--border); }
        .pimg-container { width: 100%; aspect-ratio: 1/1; position: relative; background: #000; overflow: hidden; }
        .pimg-container img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
        
        /* --- FILTERS --- */
        .f-glow { filter: brightness(1.2) saturate(1.5); }
        .f-dreamy { filter: sepia(0.2) brightness(1.1) blur(0.5px); }
        .f-cyber { filter: hue-rotate(180deg) saturate(2); }
        .f-vibrant { filter: contrast(1.2) saturate(1.8); }

        /* --- NAV --- */
        #nav { position: fixed; bottom: 0; left: 0; right: 0; height: 85px; background: rgba(10,10,20,0.95); display: flex; border-top: 1px solid var(--border); backdrop-filter: blur(20px); padding-bottom: 20px; z-index: 1000; }
        .nb { flex: 1; background: none; border: none; color: #666; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; transition: 0.3s; }
        .nb.on { color: var(--pink); }
        .nb .ic { font-size: 24px; margin-bottom: 4px; }

        /* --- CREATE PAGE --- */
        .upload-zone { border: 2px dashed var(--pink); border-radius: 20px; padding: 40px; text-align: center; cursor: pointer; background: rgba(255,45,120,0.05); }
        .filt-row { display: flex; gap: 10px; overflow-x: auto; padding: 15px 0; }
        .fb { min-width: 70px; text-align: center; opacity: 0.6; cursor: pointer; }
        .fb.sel { opacity: 1; color: var(--pink); font-weight: bold; }
        .fb .fp { width: 50px; height: 50px; background: var(--bg2); border-radius: 12px; margin: 0 auto 5px; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 2px solid transparent; }
        .fb.sel .fp { border-color: var(--pink); }

        .btn-main { width: 100%; padding: 16px; border-radius: 16px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; font-family: inherit; font-size: 16px; transition: 0.2s; }
        .btn-ai { background: var(--grad); color: #fff; }
        .btn-ai:disabled { opacity: 0.5; }
    </style>
</head>
<body>

<div id="app">
    <div id="header">
        <div class="logo">GlowUp ✨</div>
        <div style="display: flex;">
            <div class="chip" style="color: var(--yellow);">🪙 <span id="hCoins">0</span></div>
            <div class="chip" style="color: var(--cyan);">⚡ <span id="hXP">0</span></div>
        </div>
    </div>

    <div id="content">
        <div id="p-feed" class="pane on">
            <div id="feedPosts"></div>
        </div>

        <div id="p-create" class="pane">
            <h2 style="margin-bottom: 15px;">יצירה ✨</h2>
            <div class="upload-zone" id="uploadZone" onclick="document.getElementById('photoInput').click()">
                <div id="uz-prompt">
                    <span style="font-size: 40px;">📸</span>
                    <p>לחץ להעלאת תמונה</p>
                </div>
                <img id="previewImg" style="display:none; width: 100%; border-radius: 12px;">
            </div>
            <input type="file" id="photoInput" accept="image/*" hidden onchange="handleImage(event)">

            <div class="filt-row" id="filtRow"></div>

            <button class="btn-main btn-ai" id="analyzeBtn" onclick="runAI()" disabled>🔍 נתח עם AI</button>
            <div id="aiOutput" style="margin-top: 20px;"></div>
        </div>

        <div id="p-profile" class="pane">
            <div style="text-align: center; padding: 20px;">
                <div style="width: 80px; height: 80px; background: var(--grad); border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 40px;">😎</div>
                <h2 id="profName">GlowUser</h2>
                <p style="color: #666;">Level <span id="profLvl">1</span></p>
            </div>
            <div style="background: var(--bg2); padding: 15px; border-radius: 15px;">
                <label style="font-size: 12px; color: #888;">מפתח AI API</label>
                <input type="password" id="apiKeyInp" style="width: 100%; background: #000; border: 1px solid var(--border); padding: 10px; color: #fff; border-radius: 8px; margin-top: 5px;">
                <button class="btn-main" style="background: #333; color: #fff;" onclick="saveKey()">שמור מפתח</button>
            </div>
        </div>
    </div>

    <div id="nav">
        <button class="nb on" onclick="switchTab('feed', this)"><span class="ic">🏠</span><span>פיד</span></button>
        <button class="nb" onclick="switchTab('create', this)"><span class="ic">➕</span><span>צור</span></button>
        <button class="nb" onclick="switchTab('profile', this)"><span class="ic">👤</span><span>פרופיל</span></button>
    </div>
</div>

<script>
/* --- STATE MANAGEMENT --- */
let state = JSON.parse(localStorage.getItem('gu_state')) || { xp: 0, coins: 100, level: 1, posts: [] };
let curFilter = 'none';
let currentImgBase64 = null;

const FILTERS = [
    { id: 'none', name: 'רגיל', ic: '🖼️', cls: '' },
    { id: 'glow', name: 'Glow', ic: '✨', cls: 'f-glow' },
    { id: 'cyber', name: 'Cyber', ic: '🤖', cls: 'f-cyber' },
    { id: 'dreamy', name: 'Dreamy', ic: '🌸', cls: 'f-dreamy' }
];

/* --- INITIALIZATION --- */
function init() {
    updateUI();
    renderFilters();
    renderFeed();
    if(localStorage.getItem('gu_key')) document.getElementById('apiKeyInp').value = "••••••••••••";
}

function updateUI() {
    document.getElementById('hCoins').innerText = state.coins;
    document.getElementById('hXP').innerText = state.xp;
    document.getElementById('profLvl').innerText = Math.floor(state.xp / 500) + 1;
    localStorage.setItem('gu_state', JSON.stringify(state));
}

function switchTab(tabId, btn) {
    document.querySelectorAll('.pane').forEach(p => p.classList.remove('on'));
    document.querySelectorAll('.nb').forEach(b => b.classList.remove('on'));
    document.getElementById('p-' + tabId).classList.add('on');
    btn.classList.add('on');
}

/* --- IMAGE HANDLING --- */
function handleImage(e) {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        currentImgBase64 = ev.target.result;
        const img = document.getElementById('previewImg');
        img.src = currentImgBase64;
        img.style.display = 'block';
        document.getElementById('uz-prompt').style.display = 'none';
        document.getElementById('analyzeBtn').disabled = false;
    };
    reader.readAsDataURL(file);
}

function renderFilters() {
    const row = document.getElementById('filtRow');
    row.innerHTML = FILTERS.map(f => `
        <div class="fb ${curFilter === f.id ? 'sel' : ''}" onclick="applyFilter('${f.id}')">
            <div class="fp">${f.ic}</div>
            <div>${f.name}</div>
        </div>
    `).join('');
}

function applyFilter(id) {
    curFilter = id;
    const img = document.getElementById('previewImg');
    const filter = FILTERS.find(f => f.id === id);
    img.className = filter.cls;
    renderFilters();
}

/* --- AI LOGIC (GENERIC) --- */
async function runAI() {
    const key = localStorage.getItem('gu_key');
    if(!key) return alert("נא להזין מפתח API בפרופיל");

    const btn = document.getElementById('analyzeBtn');
    btn.innerText = "מנתח...";
    btn.disabled = true;

    try {
        // סימולציה של AI (כדי שהקוד לא יקרוס בלי מפתח אמיתי/שרת)
        // במציאות מחליפים את ה-Fetch הזה לקריאה ל-OpenAI/Anthropic
        setTimeout(() => {
            const mockResult = {
                score: Math.floor(Math.random() * 30) + 70,
                vibe: "Neon Cyber Vibes",
                caption: "חי את החלוץ של המחר ✨ #GlowUp"
            };
            showAIResult(mockResult);
            btn.innerText = "🔍 נתח שוב";
            btn.disabled = false;
        }, 2000);
    } catch (err) {
        alert("שגיאת AI");
        btn.disabled = false;
    }
}

function showAIResult(res) {
    document.getElementById('aiOutput').innerHTML = `
        <div style="background: var(--bg2); padding: 20px; border-radius: 20px; border: 1px solid var(--pink);">
            <div style="font-size: 32px; font-weight: 800; color: var(--pink); text-align: center;">${res.score}%</div>
            <div style="text-align: center; font-size: 12px; margin-bottom: 15px;">GlowScore</div>
            <p><b>Vibe:</b> ${res.vibe}</p>
            <p style="margin-top: 10px;"><b>Caption:</b> ${res.caption}</p>
            <button class="btn-main btn-ai" onclick="postToFeed('${res.caption}', ${res.score})">📲 פרסם לפיד</button>
        </div>
    `;
}

/* --- FEED & POSTING --- */
function postToFeed(cap, score) {
    const newPost = {
        id: Date.now(),
        img: currentImgBase64,
        filter: FILTERS.find(f => f.id === curFilter).cls,
        caption: cap,
        score: score,
        likes: 0
    };
    state.posts.unshift(newPost);
    state.xp += 100;
    state.coins += 20;
    updateUI();
    renderFeed();
    switchTab('feed', document.querySelectorAll('.nb')[0]);
    // Reset Create
    document.getElementById('previewImg').style.display = 'none';
    document.getElementById('uz-prompt').style.display = 'block';
    document.getElementById('aiOutput').innerHTML = '';
}

function renderFeed() {
    const feed = document.getElementById('feedPosts');
    if(state.posts.length === 0) {
        feed.innerHTML = "<p style='text-align:center; padding:50px; color:#666;'>עדיין אין פוסטים... תהיה הראשון!</p>";
        return;
    }
    feed.innerHTML = state.posts.map(p => `
        <div class="card">
            <div style="padding: 15px; font-weight: bold; display: flex; align-items: center; justify-content: space-between;">
                <span>אתה 😎</span>
                <span style="color: var(--pink);">⭐ ${p.score}</span>
            </div>
            <div class="pimg-container">
                <img src="${p.img}" class="${p.filter}">
            </div>
            <div style="padding: 15px;">
                <p>${p.caption}</p>
            </div>
        </div>
    `).join('');
}

function saveKey() {
    const val = document.getElementById('apiKeyInp').value;
    if(val && val !== "••••••••••••") {
        localStorage.setItem('gu_key', val);
        alert("המפתח נשמר בהצלחה!");
    }
}

init();
</script>
</body>
</html>
