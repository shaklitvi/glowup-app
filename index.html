<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>GlowUp AI</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary: #ff3b5c;
            --secondary: #00f2ea;
            --bg: #000000;
            --surface: #121212;
            --text: #ffffff;
            --grad: linear-gradient(45deg, var(--primary), var(--secondary));
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: fixed; /* מונע גלילה מיותרת באייפון */
            width: 100%;
        }

        /* Header Area */
        header {
            padding: 50px 20px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 900;
            background: var(--grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .pro-badge {
            background: var(--grad);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Feed / Hero Section */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 20px;
        }

        .upload-container {
            width: 100%;
            aspect-ratio: 1/1.2;
            background: var(--surface);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.2s ease;
        }

        .upload-container:active {
            transform: scale(0.98);
        }

        .glow-effect {
            position: absolute;
            width: 150px;
            height: 150px;
            background: var(--primary);
            filter: blur(80px);
            opacity: 0.3;
            z-index: 0;
        }

        .upload-icon {
            font-size: 60px;
            background: var(--grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            z-index: 1;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 20px;
            font-weight: 700;
            z-index: 1;
        }

        .sub-text {
            font-size: 14px;
            opacity: 0.5;
            margin-top: 8px;
            z-index: 1;
        }

        /* Bottom Navigation - TikTok Style */
        nav {
            height: 90px;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(10px);
            border-top: 0.5px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #888;
            text-decoration: none;
            font-size: 11px;
            flex: 1;
        }

        .nav-link.active {
            color: #fff;
        }

        .nav-link i {
            font-size: 22px;
        }

        /* Center Button (Plus) */
        .add-btn {
            position: relative;
            width: 45px;
            height: 30px;
            background: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            font-size: 18px;
            font-weight: bold;
        }

        .add-btn::before {
            content: '';
            position: absolute;
            left: -3px;
            top: 0;
            width: 100%;
            height: 100%;
            background: var(--secondary);
            border-radius: 8px;
            z-index: -1;
        }

        .add-btn::after {
            content: '';
            position: absolute;
            right: -3px;
            top: 0;
            width: 100%;
            height: 100%;
            background: var(--primary);
            border-radius: 8px;
            z-index: -1;
        }

        #file-input {
            display: none;
        }

        /* Processing Modal Style */
        #loader {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-text">GlowUp</div>
        <div class="pro-badge">AI PRO</div>
    </header>

    <main>
        <div class="upload-container" onclick="document.getElementById('file-input').click()">
            <div class="glow-effect"></div>
            <i class="fas fa-wand-magic-sparkles upload-icon"></i>
            <div class="upload-text">הוסף קסם לתמונה</div>
            <div class="sub-text">לחץ להעלאה מהגלריה</div>
            <input type="file" id="file-input" accept="image/*">
        </div>
    </main>

    <div id="loader">
        <div class="spinner"></div>
        <p style="margin-top: 20px; font-weight: bold;">ה-AI מעבד את הקסם שלך...</p>
    </div>

    <nav>
        <a href="#" class="nav-link active">
            <i class="fas fa-home"></i>
            <span>ראשי</span>
        </a>
        <a href="#" class="nav-link">
            <i class="fas fa-search"></i>
            <span>גלה</span>
        </a>
        <div class="add-btn" onclick="document.getElementById('file-input').click()">
            <i class="fas fa-plus"></i>
        </div>
        <a href="#" class="nav-link">
            <i class="fas fa-comment-dots"></i>
            <span>הודעות</span>
        </a>
        <a href="#" class="nav-link">
            <i class="fas fa-user"></i>
            <span>פרופיל</span>
        </a>
    </nav>

    <script>
        const fileInput = document.getElementById('file-input');
        const loader = document.getElementById('loader');

        fileInput.onchange = function() {
            if(this.files && this.files[0]) {
                loader.style.display = 'flex';
                // סימולציה של עיבוד AI למשך 3 שניות
                setTimeout(() => {
                    loader.style.display = 'none';
                    alert('העיבוד הסתיים! במוצר המלא כאן תופיע התוצאה.');
                }, 3000);
            }
        };
    </script>
</body>
</html>
