<!DOCTYPE html>

<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080810">
<meta name="description" content="GlowUp - הרשת החברתית של ה-Gen-Z הישראלי">
<title>GlowUp ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Noto+Sans+Hebrew:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080810;
  --bg2: #0d0d1a;
  --bg3: #13131f;
  --glass: rgba(255,255,255,0.04);
  --glass2: rgba(255,255,255,0.07);
  --border: rgba(255,255,255,0.08);
  --pink: #ff2d78;
  --purple: #a855f7;
  --cyan: #00d4ff;
  --yellow: #ffd60a;
  --green: #39ff14;
  --text: #f0f0ff;
  --muted: rgba(240,240,255,0.45);
  --grad: linear-gradient(135deg,#ff2d78,#a855f7,#00d4ff);
  --grad2: linear-gradient(135deg,#a855f7,#ff2d78);
  --sbot: env(safe-area-inset-bottom,0px);
  --stop: env(safe-area-inset-top,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans Hebrew',sans-serif;overflow:hidden}

/* ── APP SHELL ── */
#app{display:flex;flex-direction:column;height:100%;height:-webkit-fill-available;max-width:430px;margin:0 auto;position:relative;background:var(–bg)}

/* ── HEADER ── */
#header{
position:relative;z-index:20;
padding:calc(var(–stop) + 12px) 18px 12px;
display:flex;align-items:center;justify-content:space-between;
background:rgba(8,8,16,.85);backdrop-filter:blur(24px);
border-bottom:1px solid var(–border);
}
.logo{font-family:‘Syne’,sans-serif;font-weight:800;font-size:22px;background:var(–grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-chips{display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:3px;background:var(–glass);border:1px solid var(–border);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600;transition:.2s}
.chip.c-streak{color:var(–pink);border-color:rgba(255,45,120,.25)}
.chip.c-coins{color:var(–yellow);border-color:rgba(255,214,10,.25)}
.chip.c-xp{color:var(–cyan);border-color:rgba(0,212,255,.25)}

/* ── CONTENT ── */
#content{flex:1;overflow:hidden;position:relative}
.pane{display:none;height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:16px}
.pane.on{display:block}
.pane::-webkit-scrollbar{display:none}

/* ── BOTTOM NAV ── */
#nav{
position:relative;z-index:20;display:flex;
background:rgba(8,8,16,.92);backdrop-filter:blur(24px);
border-top:1px solid var(–border);
padding-bottom:var(–sbot);
}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 0;border:none;background:none;color:var(–muted);font-size:10px;font-family:‘Noto Sans Hebrew’,sans-serif;font-weight:500;cursor:pointer;gap:3px;transition:.2s}
.nb.on{color:var(–pink)}
.nb .ic{font-size:22px;transition:.15s}
.nb.on .ic{transform:scale(1.12)}
.nb.nb-create .ic{
width:46px;height:46px;background:var(–grad);border-radius:14px;
display:flex;align-items:center;justify-content:center;font-size:22px;
box-shadow:0 0 22px rgba(255,45,120,.45);margin-top:-10px;
}

/* ── FEED ── */
.stories{display:flex;gap:10px;padding:14px 14px 6px;overflow-x:auto;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;flex-shrink:0}
.story-ring{width:58px;height:58px;border-radius:50%;background:var(–grad);padding:2px}
.story-inner{width:100%;height:100%;border-radius:50%;background:var(–bg2);display:flex;align-items:center;justify-content:center;font-size:22px}
.story-lbl{font-size:10px;color:var(–muted);max-width:62px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.card{margin:8px 14px;background:var(–glass);border:1px solid var(–border);border-radius:20px;overflow:hidden;animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.ph{display:flex;align-items:center;padding:12px 14px;gap:10px}
.av{width:36px;height:36px;border-radius:50%;background:var(–grad);padding:1.5px;flex-shrink:0}
.av-in{width:100%;height:100%;border-radius:50%;background:var(–bg2);display:flex;align-items:center;justify-content:center;font-size:16px}
.pu{flex:1}
.pname{font-size:13px;font-weight:600}
.ptime{font-size:11px;color:var(–muted)}
.glow-badge{background:var(–grad2);border-radius:20px;padding:3px 9px;font-size:11px;font-weight:700;font-family:‘Syne’,sans-serif;color:#fff}

.pimg{width:100%;padding-bottom:100%;position:relative;background:linear-gradient(135deg,var(–bg2),var(–bg3))}
.pimg-emoji{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:72px}
.pimg-real{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.score-tag{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);border:1px solid rgba(255,214,10,.3);border-radius:10px;padding:4px 10px;font-family:‘Syne’,sans-serif;font-size:13px;font-weight:800;color:var(–yellow)}

.pvibe{margin:8px 14px;padding:7px 12px;background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.2);border-radius:10px;font-size:12px;color:var(–purple)}
.pcap{padding:0 14px 8px;font-size:13px;line-height:1.55;color:rgba(240,240,255,.82)}
.ptags{padding:0 14px 8px;display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;color:var(–cyan);font-weight:500}

.pacts{display:flex;align-items:center;padding:8px 14px 12px;gap:16px}
.pact{display:flex;align-items:center;gap:5px;background:none;border:none;color:var(–muted);font-size:13px;font-family:‘Noto Sans Hebrew’,sans-serif;cursor:pointer;transition:.15s}
.pact:active{transform:scale(.88)}
.pact.liked{color:var(–pink)}
.pact .ai{font-size:20px}

/* ── TASKS ── */
.t-head{padding:20px 16px 10px}
.t-title{font-family:‘Syne’,sans-serif;font-size:21px;font-weight:800;margin-bottom:3px}
.t-sub{font-size:13px;color:var(–muted)}

.xp-box{margin:14px 16px 0;background:var(–glass);border:1px solid var(–border);border-radius:16px;padding:14px 16px}
.xp-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}
.xp-row span:first-child{color:var(–cyan);font-weight:600}
.xp-row span:last-child{color:var(–muted)}
.xp-track{height:8px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,var(–cyan),var(–purple));border-radius:4px;transition:width .5s ease;box-shadow:0 0 10px rgba(0,212,255,.45)}

.tsec{padding:18px 16px 6px;font-family:‘Syne’,sans-serif;font-size:13px;font-weight:700;color:var(–muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;justify-content:space-between}
.tsec button{background:var(–glass);border:1px solid var(–border);border-radius:8px;padding:4px 10px;color:var(–purple);font-size:11px;font-family:‘Noto Sans Hebrew’,sans-serif;cursor:pointer}

.tc{margin:5px 16px;background:var(–glass);border:1px solid var(–border);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;transition:.2s}
.tc:active{transform:scale(.98);background:var(–glass2)}
.tc.done{opacity:.45;border-color:rgba(57,255,20,.3)}
.tic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.bg-p{background:rgba(255,45,120,.15)}
.bg-c{background:rgba(0,212,255,.15)}
.bg-u{background:rgba(168,85,247,.15)}
.bg-y{background:rgba(255,214,10,.15)}
.bg-g{background:rgba(57,255,20,.15)}
.tinfo{flex:1}
.tname{font-size:14px;font-weight:600;margin-bottom:3px}
.tdesc{font-size:12px;color:var(–muted);line-height:1.4}
.trews{display:flex;gap:6px;margin-top:7px}
.rew{font-size:11px;font-weight:600;padding:2px 8px;border-radius:7px}
.rew-xp{background:rgba(0,212,255,.14);color:var(–cyan)}
.rew-c{background:rgba(255,214,10,.14);color:var(–yellow)}
.tchk{width:24px;height:24px;border-radius:50%;border:2px solid var(–border);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;font-size:13px;transition:.2s}
.tc.done .tchk{background:var(–green);border-color:var(–green);color:#000}

.ai-tasks-btn{
margin:14px 16px;width:calc(100% - 32px);padding:16px;
background:linear-gradient(135deg,var(–purple),var(–pink));border:none;border-radius:16px;
color:#fff;font-size:15px;font-weight:700;font-family:‘Noto Sans Hebrew’,sans-serif;cursor:pointer;
display:flex;align-items:center;justify-content:center;gap:8px;
box-shadow:0 4px 22px rgba(168,85,247,.38);transition:.2s
}
.ai-tasks-btn:active{transform:scale(.97)}
.ai-tasks-btn:disabled{opacity:.5;cursor:not-allowed}

/* ── CREATE ── */
.cr-wrap{padding:20px 16px}
.cr-title{font-family:‘Syne’,sans-serif;font-size:21px;font-weight:800;margin-bottom:3px}
.cr-sub{font-size:13px;color:var(–muted);margin-bottom:18px}

.upload-zone{
border:2px dashed rgba(255,45,120,.35);border-radius:20px;
padding:44px 20px;text-align:center;background:rgba(255,45,120,.04);
cursor:pointer;transition:.2s;position:relative;overflow:hidden
}
.upload-zone:active{background:rgba(255,45,120,.09)}
.upload-zone.has-img{padding:0;border:none}
.upload-zone.has-img .uz-ico,.upload-zone.has-img .uz-txt,.upload-zone.has-img .uz-hint{display:none}
.uz-ico{font-size:52px;margin-bottom:10px}
.uz-txt{font-size:16px;font-weight:600;margin-bottom:4px}
.uz-hint{font-size:12px;color:var(–muted)}
#previewImg{display:none;width:100%;border-radius:18px}
#photoInput{display:none}

.reupload-btn{
margin-top:10px;width:100%;padding:10px;background:var(–glass);border:1px solid var(–border);
border-radius:12px;color:var(–muted);font-size:13px;font-family:‘Noto Sans Hebrew’,sans-serif;cursor:pointer
}

.filt-wrap{margin-top:14px;display:none}
.filt-lbl{font-size:12px;font-weight:600;color:var(–muted);margin-bottom:8px}
.filt-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filt-row::-webkit-scrollbar{display:none}
.fb{flex-shrink:0;width:64px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;transition:.15s}
.fb:active{transform:scale(.92)}
.fp{width:64px;height:64px;border-radius:14px;border:2px solid transparent;overflow:hidden;background:var(–bg3);font-size:28px;display:flex;align-items:center;justify-content:center;position:relative;transition:.2s}
.fb.sel .fp{border-color:var(–pink);box-shadow:0 0 12px rgba(255,45,120,.4)}
.fb.lckd .fp::after{content:‘🔒’;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);border-radius:12px;font-size:18px}
.fn{font-size:10px;color:var(–muted)}

.analyze-btn{
margin-top:18px;width:100%;padding:18px;
background:var(–grad);border:none;border-radius:16px;
color:#fff;font-size:17px;font-weight:700;font-family:‘Noto Sans Hebrew’,sans-serif;
cursor:pointer;box-shadow:0 4px 28px rgba(255,45,120,.38);transition:.2s;
display:flex;align-items:center;justify-content:center;gap:8px
}
.analyze-btn:disabled{opacity:.5;cursor:not-allowed}
.analyze-btn:active:not(:disabled){transform:scale(.97)}

/* AI RESULT */
.ai-card{margin-top:18px;background:var(–glass);border:1px solid var(–border);border-radius:20px;padding:20px;animation:rise .4s ease}
.score-big{text-align:center;margin-bottom:18px}
.score-lbl{font-size:12px;color:var(–muted);margin-bottom:4px}
.score-num{font-family:‘Syne’,sans-serif;font-size:76px;font-weight:800;background:var(–grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.score-bar{height:7px;background:rgba(255,255,255,.07);border-radius:4px;margin-top:12px;overflow:hidden}
.score-fill{height:100%;background:var(–grad);border-radius:4px;box-shadow:0 0 12px rgba(255,45,120,.5)}

.rs{margin-bottom:14px}
.rl{font-size:10px;font-weight:700;color:var(–muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.rv{font-size:14px;line-height:1.5}
.rv.vibe{color:var(–purple);font-weight:600}
.rv.tip{color:var(–yellow)}
.rhash{display:flex;flex-wrap:wrap;gap:5px}
.cpbtn{display:inline-flex;align-items:center;gap:4px;background:var(–glass2);border:1px solid var(–border);border-radius:8px;padding:4px 10px;color:var(–cyan);font-size:11px;font-family:‘Noto Sans Hebrew’,sans-serif;cursor:pointer;margin-top:6px}
.post-btn{width:100%;padding:16px;background:linear-gradient(135deg,var(–green),var(–cyan));border:none;border-radius:14px;color:#000;font-size:15px;font-weight:700;font-family:‘Noto Sans Hebrew’,sans-serif;cursor:pointer;margin-top:14px;transition:.2s}
.post-btn:active{transform:scale(.97)}

/* ── STORE ── */
.sh{padding:20px 16px 10px}
.s-title{font-family:‘Syne’,sans-serif;font-size:21px;font-weight:800;margin-bottom:3px}
.s-bal{display:flex;align-items:center;gap:5px;font-size:14px;color:var(–yellow);font-weight:600;margin-bottom:14px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.si{background:var(–glass);border:1px solid var(–border);border-radius:18px;overflow:hidden;cursor:pointer;transition:.2s}
.si:active{transform:scale(.96)}
.si.owned{border-color:rgba(57,255,20,.4)}
.si-prev{aspect-ratio:1;background:var(–bg3);display:flex;align-items:center;justify-content:center;font-size:52px;position:relative}
.si-prev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.si-info{padding:10px 12px}
.si-name{font-size:13px;font-weight:600;margin-bottom:3px}
.si-price{display:flex;align-items:center;gap:3px;font-size:12px;color:var(–yellow);font-weight:600}
.si-owned{font-size:12px;color:var(–green);font-weight:600}

.store-section-title{
padding:18px 16px 8px;
font-family:‘Syne’,sans-serif;font-size:13px;font-weight:700;
color:var(–muted);text-transform:uppercase;letter-spacing:.06em
}

/* ── PROFILE ── */
.prof-hdr{padding:24px 16px 14px;text-align:center}
.pav{width:82px;height:82px;border-radius:50%;background:var(–grad);padding:3px;margin:0 auto 12px;cursor:pointer}
.pav-in{width:100%;height:100%;border-radius:50%;background:var(–bg2);display:flex;align-items:center;justify-content:center;font-size:38px}
.pname{font-family:‘Syne’,sans-serif;font-size:20px;font-weight:800;margin-bottom:6px}
.plvl{display:inline-flex;align-items:center;gap:4px;background:var(–grad2);border-radius:20px;padding:4px 14px;font-size:12px;font-weight:700;color:#fff}

.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin:14px 16px;background:var(–border);border:1px solid var(–border);border-radius:18px;overflow:hidden}
.pstat{background:var(–glass);padding:14px 8px;text-align:center}
.psv{font-family:‘Syne’,sans-serif;font-size:22px;font-weight:800;background:var(–grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.psl{font-size:11px;color:var(–muted);margin-top:2px}

.ach-sec{padding:0 16px 14px}
.sec-title{font-family:‘Syne’,sans-serif;font-size:16px;font-weight:700;margin-bottom:10px}
.ach-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ach{background:var(–glass);border:1px solid var(–border);border-radius:14px;padding:10px 4px;text-align:center;transition:.15s;cursor:default}
.ach.got{border-color:rgba(255,214,10,.38);cursor:pointer}
.ach.got:active{transform:scale(.93)}
.ach-ic{font-size:24px;margin-bottom:3px}
.ach-nm{font-size:9px;color:var(–muted);line-height:1.25}
.ach.lock{opacity:.35;filter:grayscale(1)}

.api-sec{margin:0 16px 16px;background:var(–glass);border:1px solid var(–border);border-radius:16px;padding:16px}
.api-tit{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.api-inp{
width:100%;background:rgba(0,0,0,.35);border:1px solid var(–border);border-radius:10px;
padding:10px 12px;color:var(–text);font-size:13px;font-family:monospace;margin-bottom:10px;direction:ltr
}
.api-inp:focus{outline:none;border-color:var(–purple)}
.api-save{
width:100%;padding:11px;background:var(–grad2);border:none;border-radius:10px;
color:#fff;font-size:14px;font-weight:600;font-family:‘Noto Sans Hebrew’,sans-serif;cursor:pointer
}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(5px);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.open{opacity:1;pointer-events:all}
.sheet{width:100%;max-width:430px;background:var(–bg2);border-radius:24px 24px 0 0;border-top:1px solid var(–border);padding:18px 18px calc(18px + var(–sbot));transform:translateY(100%);transition:transform .3s ease}
.overlay.open .sheet{transform:translateY(0)}
.handle{width:38px;height:4px;background:var(–border);border-radius:2px;margin:0 auto 18px}

.com-list{max-height:42vh;overflow-y:auto;margin-bottom:12px}
.com-list::-webkit-scrollbar{display:none}
.com{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(–border)}
.com:last-child{border-bottom:none}
.com-av{width:30px;height:30px;border-radius:50%;background:var(–grad);padding:1px;flex-shrink:0}
.com-av-in{width:100%;height:100%;border-radius:50%;background:var(–bg2);display:flex;align-items:center;justify-content:center;font-size:13px}
.com-user{font-size:12px;font-weight:600;margin-bottom:2px}
.com-txt{font-size:13px;color:rgba(240,240,255,.8)}
.com-input-row{display:flex;gap:8px}
.com-input{flex:1;background:var(–glass2);border:1px solid var(–border);border-radius:12px;padding:10px 14px;color:var(–text);font-size:14px;font-family:‘Noto Sans Hebrew’,sans-serif}
.com-input:focus{outline:none;border-color:var(–purple)}
.com-send{width:46px;height:46px;background:var(–grad);border:none;border-radius:12px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(80px + var(–sbot));left:50%;transform:translateX(-50%) translateY(18px);background:rgba(16,16,28,.95);backdrop-filter:blur(12px);border:1px solid var(–border);border-radius:16px;padding:11px 20px;font-size:14px;font-weight:600;z-index:300;opacity:0;transition:all .28s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── SPINNER ── */
.spin{display:inline-block;width:20px;height:20px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── FILTER CLASSES ── */
.f-none{filter:none}
.f-glow{filter:brightness(1.1) saturate(1.4) contrast(1.06)}
.f-dreamy{filter:brightness(1.15) saturate(.8) blur(.3px) hue-rotate(10deg)}
.f-vibrant{filter:saturate(1.9) contrast(1.1) brightness(1.05)}
.f-moody{filter:brightness(.82) saturate(1.25) contrast(1.2)}
.f-golden{filter:sepia(.35) brightness(1.12) saturate(1.45) hue-rotate(-12deg)}
.f-cyber{filter:saturate(2.2) hue-rotate(195deg) brightness(1.1)}
.f-soft{filter:brightness(1.12) saturate(.85) blur(.4px)}

/* ── MISC ── */
.empty-state{text-align:center;padding:40px 20px;color:var(–muted);font-size:15px}
.empty-state .em-ic{font-size:48px;margin-bottom:12px}
</style>

</head>
<body>
<div id="app">

  <!-- HEADER -->

  <div id="header">
    <div class="logo">GlowUp ✨</div>
    <div class="hdr-chips">
      <div class="chip c-streak">🔥 <span id="hStreak">0</span></div>
      <div class="chip c-coins">🪙 <span id="hCoins">0</span></div>

function checkStreak(){
  const last=localStorage.getItem('gu_login');
  const today=new Date().toDateString();
  if(last!==today){
    const yest=new Date();yest.setDate(yest.getDate()-1);
    if(last===yest.toDateString()) state.streak++;
    else if(!last) state.streak=1;
    else state.streak=1;
    localStorage.setItem('gu_login',today);
  }
}

function postHTML(p){
  const hasPic=p.imgData;
  return `<div class="card" id="post-${p.id}">
  <div class="ph">
    <div class="av"><div class="av-in">${p.av||'😎'}</div></div>
    <div class="pu"><div class="pname">${esc(p.user)}</div><div class="ptime">${p.time}</div></div>
    ${p.score?`<div class="glow-badge">⭐ ${p.score}</div>`:''}
  </div>
  <div class="pimg">
    ${hasPic?`<img class="pimg-real ${p.filterCls||''}" src="${p.imgData}" alt="">`:`<div class="pimg-emoji">${p.emoji||'✨'}</div>`}
    ${p.score?`<div class="score-tag">GlowScore ${p.score}</div>`:''}
  </div>
  ${p.vibe?`<div class="pvibe">🔮 ${esc(p.vibe)}</div>`:''}
  <div class="pcap">${esc(p.cap)}</div>
  ${p.tags&&p.tags.length?`<div class="ptags">${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
  <div class="pacts">
    <button class="pact ${p.liked?'liked':''}" onclick="toggleLike('${p.id}',this)">
      <span class="ai">${p.liked?'❤️':'🤍'}</span>
      <span id="lk-${p.id}">${p.likes||0}</span>

    <button class="pact" onclick="openComments('${p.id}')">
      <span class="ai">💬</span>
      <span id="cc-${p.id}">${(p.comments||[]).length}</span>
    </button>
    <button class="pact" onclick="sharePost()">
      <span class="ai">📤</span>
    </button>
  </div>
</div>`;
}

function toggleLike(pid,btn){
  const p=posts.find(x=>x.id===pid);if(!p)return;
  p.liked=!p.liked;p.likes=(p.likes||0)+(p.liked?1:-1);
  btn.classList.toggle('liked',p.liked);
  btn.querySelector('.ai').textContent=p.liked?'❤️':'🤍';
  el('lk-'+pid).textContent=p.likes;
  if(p.liked){addXP(5);addCoins(2);persist()}
}

function openComments(pid){
  comPostId=pid;
  const p=posts.find(x=>x.id===pid);if(!p)return;
  el('comList').innerHTML=(p.comments||[]).length
    ? (p.comments||[]).map(c=>`<div class="com"><div class="com-av"><div class="com-av-in">${c.av||'😊'}</div></div><div><div class="com-user">${esc(c.user)}</div><div class="com-txt">${esc(c.txt)}</div></div></div>`).join('')
    : '<div style="text-align:center;color:var(--muted);padding:20px">אין תגובות עדיין 💬</div>';
  el('comInput').value='';
  openModal('comModal');
}

function sendComment(){
  const txt=el('comInput').value.trim();if(!txt)return;
  const p=posts.find(x=>x.id===comPostId);if(!p)return;
  p.comments=p.comments||[];
  p.comments.push({user:'אתה',av:'😎',txt});
  el('comList').innerHTML+= `<div class="com"><div class="com-av"><div class="com-av-in">😎</div></div><div><div class="com-user">אתה</div><div class="com-txt">${esc(txt)}</div></div></div>`;
  el('comList').scrollTop=el('comList').scrollHeight;
  el('comInput').value='';
  el('cc-'+comPostId).textContent=p.comments.length;

function sharePost(){

function renderTasks(){

function doTask(id){
  const t=tasks.find(x=>x.id===id);if(!t||t.done)return;
  t.done=true;
  addXP(t.xp);addCoins(t.coins);state.tasksOk++;
  persist();renderTasks();
  toast(`✅ ${t.name} הושלמה! +${t.xp} XP 🎉`,'var(--green)');
  if(state.tasksOk>=10)unlock('tasks10');
  checkAchs();
}

function resetTasks(){
  tasks=DEF_TASKS.map(t=>({...t,done:false}));

}

async function generateTasksAI(){
  if(!apiKey){toast('❌ הכנס מפתח API בפרופיל');switchTab('profile',document.querySelectorAll('.nb')[4]);return}
  const btn=el('aiTaskBtn');btn.innerHTML='<span class="spin"></span> מייצר...';btn.disabled=true;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',max_tokens:1000,
        messages:[{role:'user',content:`Create 5 fun daily social media tasks for Israeli Gen-Z teens using a GlowUp app (Instagram+TikTok+AI). 
Return ONLY a valid JSON array, no markdown, no explanation:
[{"id":1,"ic":"emoji","name":"Hebrew name max 4 words","desc":"Hebrew task desc max 10 words","xp":50,"coins":20,"bg":"bg-p","done":false}]
bg options: bg-p bg-c bg-u bg-y bg-g. Make tasks creative, social, photo/video-based. Vary the XP 20-120.`}]
      })
    });
    const d=await res.json();
    if(d.error)throw new Error(d.error.message);
    const raw=d.content[0].text.replace(/```json|```/g,'').trim();
    tasks=JSON.parse(raw);
    persist();renderTasks();
    toast('✨ משימות AI חדשות!','var(--purple)');
  }catch(e){
    toast('❌ שגיאה: '+(e.message||'בדוק מפתח API'));
  }finally{
    btn.innerHTML='✨ צור משימות AI חדשות';btn.disabled=false;
  }
}

/* ═══════════════════════════════
   CREATE / UPLOAD
═══════════════════════════════ */
function triggerUpload(){document.getElementById('photoInput').click()}

function onPhotoSelect(e){
  const file=e.target.files[0];if(!file)return;
  uploadedMime=file.type||'image/jpeg';
  const reader=new FileReader();
  reader.onload=ev=>{
    const full=ev.target.result;
    uploadedB64=full.split(',')[1];
    const img=el('previewImg');
    img.src=full;img.style.display='block';
    img.className=curFilterCls();
    el('uploadZone').classList.add('has-img');
    el('reuploadBtn').style.display='block';
    el('filtWrap').style.display='block';
    el('analyzeBtn').disabled=false;
    el('aiResult').innerHTML='';
    renderFilters();
  };
  reader.readAsDataURL(file);
  e.target.value='';
}

function curFilterCls(){return FILTERS.find(f=>f.id===curFilter)?.cls||'f-none'}

function renderFilters(){
  el('filtRow').innerHTML=FILTERS.map(f=>{
    const owned=state.filters.includes(f.id);
    return `<button class="fb ${curFilter===f.id?'sel':''} ${!owned?'lckd':''}"
      onclick="${owned?`selFilt('${f.id}')`:`toast('🔒 קנה בחנות!')`}">
      <div class="fp">${f.ic}</div>
      <div class="fn">${f.name}</div>
    </button>`;
  }).join('');
}

function selFilt(id){
  curFilter=id;
  const img=el('previewImg');
  if(img)img.className=FILTERS.find(f=>f.id===id)?.cls||'f-none';
  renderFilters();
}

async function analyzePhoto(){
  if(!uploadedB64){toast('❌ העלה תמונה תחילה');return}
  if(!apiKey){toast('❌ הכנס מפתח API בפרופיל');switchTab('profile',document.querySelectorAll('.nb')[4]);return}
  const btn=el('analyzeBtn');
  btn.innerHTML='<span class="spin"></span> מנתח...';btn.disabled=true;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',max_tokens:1000,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:uploadedMime,data:uploadedB64}},
          {type:'text',text:`Analyze this photo for GlowUp - an Israeli Gen-Z social app. Return ONLY valid JSON, no markdown:
{"glowScore":number_1_to_100,"vibe":"English vibe 3-5 words","captionHe":"Hebrew caption with emojis max 15 words","captionEn":"English caption with emojis max 15 words","hashtags":["#tag1","#tag2","#tag3","#tag4","#tag5"],"tip":"Hebrew improvement tip max 10 words"}`}
        ]}]
      })
    });
    const d=await res.json();
    if(d.error)throw new Error(d.error.message);
    const raw=d.content[0].text.replace(/```json|```/g,'').trim();
    const r=JSON.parse(raw);
    showResult(r);
    addXP(30);addCoins(15);
    if(r.glowScore>=80){addXP(50);addCoins(30);unlock('glow80');toast(`🌟 GlowScore ${r.glowScore}! +80 XP`,'var(--yellow)')}
    else toast(`✅ ניתוח הושלם! +30 XP`,'var(--green)');
    unlock('ai_fan');persist();
  }catch(e){
    toast('❌ שגיאה: '+(e.message||'בדוק מפתח API'));
  }finally{
    btn.innerHTML='🔍 נתח שוב';btn.disabled=false;
  }
}

function showResult(r){
  el('aiResult').innerHTML=`
  <div class="ai-card">
    <div class="score-big">
      <div class="score-lbl">GlowScore שלך</div>
      <div class="score-num">${r.glowScore}</div>
      <div class="score-bar"><div class="score-fill" style="width:${r.glowScore}%"></div></div>
    </div>
    <div class="rs"><div class="rl">Vibe</div><div class="rv vibe">🔮 ${esc(r.vibe)}</div></div>
    <div class="rs">
      <div class="rl">קפטשן עברית</div>
      <div class="rv">${esc(r.captionHe)}</div>
      <button class="cpbtn" onclick="copyText(${JSON.stringify(r.captionHe)})">📋 העתק</button>
    </div>
    <div class="rs">
      <div class="rl">English Caption</div>
      <div class="rv">${esc(r.captionEn)}</div>
      <button class="cpbtn" onclick="copyText(${JSON.stringify(r.captionEn)})">📋 Copy</button>
    </div>
    <div class="rs">
      <div class="rl">האשטאגים</div>
      <div class="rhash">${(r.hashtags||[]).map(h=>`<span class="tag">${esc(h)}</span>`).join('')}</div>
      <button class="cpbtn" onclick="copyText(${JSON.stringify((r.hashtags||[]).join(' '))})">📋 העתק הכל</button>
    </div>
    ${r.tip?`<div class="rs"><div class="rl">טיפ לשיפור</div><div class="rv tip">💡 ${esc(r.tip)}</div></div>`:''}
    <button class="post-btn" onclick="postToFeed(${JSON.stringify(r).replace(/</g,'&lt;').replace(/>/g,'&gt;')})">📲 פרסם לפיד</button>
  </div>`;
  el('aiResult').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function postToFeed(r){
  const imgData='data:'+uploadedMime+';base64,'+uploadedB64;
  const filterCls=curFilterCls();
  const p={
    id:'u'+Date.now(),user:'אתה 😎',av:'😎',time:'עכשיו',
    score:r.glowScore,cap:r.captionHe,vibe:r.vibe,
    tags:r.hashtags||[],likes:0,comments:[],liked:false,
    emoji:'✨',imgData,filterCls,
  };
  posts.push(p);state.posts++;
  addXP(20);addCoins(10);
  unlock('first_post');persist();
  renderFeed();
  switchTab('feed',document.querySelectorAll('.nb')[0]);
  toast('🎉 הפוסט עלה לפיד!','var(--green)');
}

/* ═══════════════════════════════
   STORE
═══════════════════════════════ */
function renderStore(){
  el('storeGrid').innerHTML=FILTERS.map(f=>{
    const owned=state.filters.includes(f.id);
    return `<div class="si ${owned?'owned':''}" onclick="buyFilter('${f.id}',${f.price})">
      <div class="si-prev">${f.ic}</div>
      <div class="si-info">
        <div class="si-name">${f.name}</div>
        ${owned?'<div class="si-owned">✅ בבעלותך</div>':f.free?'<div class="si-owned">🆓 חינם</div>':`<div class="si-price">🪙 ${f.price}</div>`}
      </div>
    </div>`;
  }).join('');
  updateHdr();
}

function buyFilter(id,price){
  if(state.filters.includes(id)){toast('✅ הפילטר כבר שלך!');return}
  if(state.coins<price){toast(`❌ חסרים ${price-state.coins} מטבעות`,'var(--pink)');return}
  state.coins-=price;
  state.filters.push(id);
  persist();renderStore();
  toast('🎨 פילטר נרכש! 🎉','var(--purple)');
  if(state.filters.length>=3)unlock('collector');
}

/* ═══════════════════════════════
   PROFILE
═══════════════════════════════ */
function renderProfile(){
  if(apiKey)el('apiInp').value='•'.repeat(22);
  el('achGrid').innerHTML=ACH_DEFS.map(a=>{
    const got=achs.includes(a.id);
    return `<div class="ach ${got?'got':'lock'}" onclick="${got?`toast('🏆 '+${JSON.stringify(a.name)}+'!')`:''}">
      <div class="ach-ic">${a.ic}</div>
      <div class="ach-nm">${a.name}</div>
    </div>`;
  }).join('');
  updateHdr();
}

function saveKey(){
  const v=el('apiInp').value.trim();
  if(!v||v.includes('•')){toast('❌ הכנס מפתח תקין');return}
  apiKey=v;localStorage.setItem('gu_key',v);
  el('apiInp').value='•'.repeat(22);
  toast('✅ מפתח נשמר!','var(--green)');
}

/* ═══════════════════════════════
   ACHIEVEMENTS
═══════════════════════════════ */
function unlock(id){
  if(achs.includes(id))return;
  achs.push(id);
  const a=ACH_DEFS.find(x=>x.id===id);
  if(a)toast(`🏆 הישג חדש: ${a.name}!`,'var(--yellow)');
  S.save('gu_achs',achs);
}
function checkAchs(){
  if(state.streak>=3)unlock('streak3');
  if(state.filters.length>=3)unlock('collector');
  if(state.tasksOk>=10)unlock('tasks10');
}

/* ═══════════════════════════════
   COPY
═══════════════════════════════ */
function copyText(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast('📋 הועתק!'));
  }else{
    const el=document.createElement('textarea');
    el.value=txt;el.style.position='fixed';el.style.opacity='0';
    document.body.appendChild(el);el.focus();el.select();
    document.execCommand('copy');document.body.removeChild(el);
    toast('📋 הועתק!');
  }
}
</script>
